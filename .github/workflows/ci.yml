name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The library runs in browsers; Node runs its tests and build. 20 is the
        # oldest Node with a global File, which the upload tests use.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # The tarball holds exactly the intended files, loads as CommonJS and ESM,
      # and the <script> build works as a script tag.
      - run: npm run verify:package
